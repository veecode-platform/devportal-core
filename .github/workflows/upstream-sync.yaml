name: Upstream Sync

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Sync ${{ matrix.veecode_branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream_branch: main
            veecode_branch: main
          - upstream_branch: release-1.10
            veecode_branch: veecode/release-1.10
    steps:
      - name: Checkout ${{ matrix.veecode_branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.veecode_branch }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/redhat-developer/rhdh.git

      - name: Fetch upstream
        env:
          UPSTREAM_BRANCH: ${{ matrix.upstream_branch }}
        run: git fetch upstream "$UPSTREAM_BRANCH"

      - name: Attempt merge
        id: merge
        env:
          UPSTREAM_BRANCH: ${{ matrix.upstream_branch }}
        run: |
          set +e
          git merge --no-edit "upstream/$UPSTREAM_BRANCH"
          status=$?
          if [ "$status" -ne 0 ]; then
            files=$(git diff --name-only --diff-filter=U)
            {
              echo "files<<SYNC_EOF"
              echo "$files"
              echo "SYNC_EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Push merged branch
        if: steps.merge.outputs.status == '0'
        env:
          VEECODE_BRANCH: ${{ matrix.veecode_branch }}
        run: git push origin "HEAD:$VEECODE_BRANCH"

      - name: Open conflict issue
        if: steps.merge.outputs.status != '0'
        uses: actions/github-script@v7
        env:
          SYNC_BRANCH: ${{ matrix.veecode_branch }}
          SYNC_UPSTREAM_BRANCH: ${{ matrix.upstream_branch }}
          SYNC_CONFLICT_FILES: ${{ steps.merge.outputs.files }}
        with:
          script: |
            const branch = process.env.SYNC_BRANCH;
            const upstreamBranch = process.env.SYNC_UPSTREAM_BRANCH;
            const files = (process.env.SYNC_CONFLICT_FILES || "").trim() || "(see workflow run log)";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `upstream sync conflict: ${branch}`,
              body: [
                `Automated weekly sync from \`upstream/${upstreamBranch}\` into \`${branch}\` hit a merge conflict. The merge was aborted; \`${branch}\` is unchanged.`,
                "",
                "**Conflicting files:**",
                "```",
                files,
                "```",
                "",
                "See `AGENTS.md` (drift manifest) for the additive-first rule before resolving.",
                "",
                `Workflow run: ${runUrl}`,
              ].join("\n"),
            });
