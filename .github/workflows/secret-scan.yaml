name: Secret Scan

on:
  push:
    branches:
      - "veecode/**"
  pull_request:
    branches:
      - "veecode/**"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Note: gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE
      # for organization-owned repositories. Run the official container
      # image directly instead, which is free for any use.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source . --no-banner --redact
