name: Secret Scan

on:
  push:
    branches:
      - "main"
      - "veecode/**"
  pull_request:
    branches:
      - "main"
      - "veecode/**"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scope the scan to the commits introduced by this push/PR, not the
      # full inherited history. A one-time full-history scan at fork
      # bootstrap found pre-existing findings in upstream's history (from
      # before this fork existed) that cannot be remediated without
      # rewriting public history. See AGENTS.md for the tracked follow-up.
      - name: Determine commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="-1 $PUSH_AFTER"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      # Note: gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE
      # for organization-owned repositories. Run the official container
      # image directly instead, which is free for any use.
      - name: Run gitleaks
        env:
          COMMIT_RANGE: ${{ steps.range.outputs.range }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            detect --source . --no-banner --redact --log-opts="$COMMIT_RANGE"
