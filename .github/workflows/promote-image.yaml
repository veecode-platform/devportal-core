name: Promote Image

# Copies an approved release-candidate tag to its final tag without rebuilding,
# so the final tag has exactly the candidate's multi-arch digest. The copy and
# its checks are the release skill's promote-image.sh.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Candidate tag to promote, for example 3.0.0-rc.2
        required: true
        type: string
      final:
        description: Final tag to create, for example 3.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-image-${{ inputs.final }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.candidate }} to ${{ inputs.final }}
    runs-on: ubuntu-24.04
    env:
      REPOSITORY: docker.io/veecode/devportal
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Assert no forbidden tags (latest / stable / 2.x)
        env:
          FINAL: ${{ inputs.final }}
        run: |
          if [[ "$FINAL" == "latest" || "$FINAL" == latest-* || "$FINAL" == "stable" || "$FINAL" == stable-* ]]; then
            echo "::error::Forbidden tag detected: $FINAL"
            exit 1
          fi
          if [[ "$FINAL" =~ ^2(\.|$) ]]; then
            echo "::error::Forbidden tag detected: $FINAL (2.x)"
            exit 1
          fi
          echo "Tag guard passed: $FINAL"

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: printf '%s' "$DOCKER_PASSWORD" | skopeo login docker.io --username "$DOCKER_USERNAME" --password-stdin

      - name: Promote by digest
        env:
          CANDIDATE: ${{ inputs.candidate }}
          FINAL: ${{ inputs.final }}
        run: bash .rulesync/skills/devportal-release/scripts/promote-image.sh "$REPOSITORY" "$CANDIDATE" "$FINAL"

      - name: Log out
        if: always()
        run: skopeo logout docker.io || true
