name: VeeCode Pre-step Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'veecode/**'
      - '.github/workflows/veecode-prestep-test.yaml'
      - '.nvmrc'
      - 'yarn.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  veecode-prestep-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      # The script's modules are transitive dependencies of packages/backend;
      # installing only these three avoids a full yarn install.
      - name: Install pg, yaml and @backstage/config-loader at their yarn.lock versions
        run: |
          set -euo pipefail
          modules=(pg@8.22.0 yaml@2.9.0 @backstage/config-loader@1.10.12)
          for module in "${modules[@]}"; do
            if ! grep -qxF "  resolution: \"${module%@*}@npm:${module##*@}\"" yarn.lock; then
              echo "::error::yarn.lock no longer resolves ${module}; update the versions in this workflow"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/prestep-modules"
          cd "$RUNNER_TEMP/prestep-modules"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts "${modules[@]}"

      - name: Run the pre-step tests
        env:
          NODE_PATH: ${{ runner.temp }}/prestep-modules/node_modules
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: node --test "veecode/test/*.test.js"
