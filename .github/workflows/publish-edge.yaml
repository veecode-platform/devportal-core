#
# Isolated, opt-in publish channel for the VeeCode fork's Docker Hub image
# (docker.io/veecode/devportal). Modeled on upstream's
# .github/workflows/next-build-image.yaml, reusing its build+push core
# (./.github/actions/get-sha, ./.github/actions/docker-build) and dropping
# the Quay-only tag-lifecycle ("merge" expiry/cleanup) logic entirely, since
# Docker Hub has no equivalent API and this channel does not need it.
#
# This workflow must never write ":latest", ":stable", or any "2.x" tag —
# docker.io/veecode/devportal is the same repository devportal-platform's
# publish.yml writes those tags to. The "Assert no forbidden tags" steps
# enforce this at build and at publish time.

name: Publish Edge

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push images to Docker Hub (false = dry-run build only, no push, no login)"
        type: boolean
        required: false
        default: false
      version:
        description: "Immutable version tag to publish (e.g. 3.0.0-alpha.1)"
        type: string
        required: false
        default: "3.0.0-alpha.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: docker.io
  REGISTRY_IMAGE: veecode/devportal

jobs:
  build-image:
    name: Build Image
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04-arm
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare
        env:
          MATRIX_OS: ${{ matrix.os }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$MATRIX_OS" == "ubuntu-24.04" ]; then
            platform="linux/amd64"
          elif [ "$MATRIX_OS" == "ubuntu-24.04-arm" ]; then
            platform="linux/arm64"
          else
            echo "Unknown platform: $MATRIX_OS"
            exit 1
          fi
          arch="${platform#*/}"

          echo "PLATFORM=$platform" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "PLATFORM_ARCH=$arch" >> "$GITHUB_ENV"
          # Per-arch tag: only the immutable version, per arch. Nothing else
          # is pushed under this job — the "edge" alias is created once, at
          # the manifest-list level, in the merge job below.
          echo "VERSION_TAG=${VERSION}-${arch}" >> "$GITHUB_ENV"

      - name: Assert no forbidden tags (latest / stable / 2.x)
        env:
          TAGS: "${{ env.VERSION_TAG }}"
        run: |
          for tag in $TAGS; do
            if [[ "$tag" == "latest" || "$tag" == latest-* || "$tag" == "stable" || "$tag" == stable-* ]]; then
              echo "::error::Forbidden tag detected: $tag"
              exit 1
            fi
            if [[ "$tag" =~ ^2(\.|$) ]]; then
              echo "::error::Forbidden tag detected: $tag (2.x)"
              exit 1
            fi
          done
          echo "Tag guard passed: $TAGS"

      - name: Get the last commit short SHA
        uses: ./.github/actions/get-sha

      - name: Build with Hermetic Build
        uses: ./.github/actions/docker-build
        id: build-image
        with:
          imageName: ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}
          imageTags: |
            type=raw,value=${{ env.VERSION_TAG }}
          platform: ${{ env.PLATFORM }}
          skipArtifactUpload: true

      # Login runs right after the build (not just before the push) so that
      # a bad/missing credential fails fast on a publish run, instead of
      # surfacing only after the ~30-40 minute hermetic build completes.
      - name: Login to Docker Hub
        if: ${{ inputs.publish }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Image to Registry
        if: ${{ inputs.publish }}
        id: push-image
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
        with:
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE }}:${{ env.VERSION_TAG }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Export digest
        if: ${{ inputs.publish }}
        id: export-digest
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          digest="$DIGEST"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest and publish tags
    runs-on: ubuntu-latest
    needs: build-image
    if: ${{ inputs.publish }}
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Assert no forbidden tags (latest / stable / 2.x)
        run: |
          for tag in "$VERSION" "edge"; do
            if [[ "$tag" == "latest" || "$tag" == "stable" ]]; then
              echo "::error::Forbidden tag detected: $tag"
              exit 1
            fi
            if [[ "$tag" =~ ^2(\.|$) ]]; then
              echo "::error::Forbidden tag detected: $tag (2.x)"
              exit 1
            fi
          done
          echo "Tag guard passed: $VERSION edge"

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Both tags are created in a single imagetools call against the same
      # digest set, so "edge" points at the same manifest-list digest as
      # the immutable version tag structurally, not by a separate step that
      # could drift.
      - name: Create manifest list and push (version + edge)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY}/${REGISTRY_IMAGE}:${VERSION}" \
            -t "${REGISTRY}/${REGISTRY_IMAGE}:edge" \
            $(printf "${REGISTRY}/${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Assert version and edge tags share the same digest
        run: |
          version_digest=$(docker buildx imagetools inspect "${REGISTRY}/${REGISTRY_IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r '.digest')
          edge_digest=$(docker buildx imagetools inspect "${REGISTRY}/${REGISTRY_IMAGE}:edge" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "::notice::${VERSION} digest: $version_digest"
          echo "::notice::edge digest: $edge_digest"
          if [[ "$version_digest" != "$edge_digest" ]]; then
            echo "::error::edge tag digest ($edge_digest) does not match ${VERSION} digest ($version_digest)"
            exit 1
          fi
          echo "PUBLISHED_DIGEST=$version_digest" >> "$GITHUB_ENV"
          echo "Published digest (shared by ${VERSION} and edge): $version_digest"

      # OD1 phase C: the baked product-face file
      # (veecode/dynamic-plugins.veecode.yaml) pins OCI plugins on
      # quay.io/veecode/* by digest. Quay garbage-collects a manifest once
      # nothing references it, and the export fleet republishes those plugins
      # under moving bs_* tags — so a face pin can silently die between
      # publishes (see 2026-08-20 incident: veecode-homepage's pinned
      # manifest went "manifest unknown", staging crash-looped). A dead face
      # pin must fail HERE, at publish time, never at pod boot.
      #
      # Quay creds: this workflow only authenticates to Docker Hub (it
      # publishes docker.io/veecode/devportal), so there is no existing
      # Quay login to reuse. QUAY_USERNAME/QUAY_TOKEN are the secret names
      # next-build-image.yaml already uses to log in to quay.io elsewhere in
      # this repo — reused here rather than inventing new secret names.
      # ASSUMPTION (unverified from this checkout, flag to Gio): those
      # secrets are exercised there against quay.io/rhdh-community/rhdh
      # (the inherited upstream path); whether they also carry write access
      # to the quay.io/veecode org is not something this repo confirms.
      - name: Check Quay credentials for face anchoring
        env:
          HAS_QUAY_AUTH: ${{ secrets.QUAY_USERNAME != '' && secrets.QUAY_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_QUAY_AUTH" != "true" ]; then
            echo "::error::Missing QUAY_USERNAME or QUAY_TOKEN secrets; cannot anchor face pins"
            exit 1
          fi
          echo "Quay credentials are available"

      - name: Login to Quay
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Anchor product-face OCI pins against GC
        env:
          FACE_FILE: veecode/dynamic-plugins.veecode.yaml
        run: |
          set -euo pipefail

          if ! command -v skopeo >/dev/null 2>&1; then
            echo "Installing skopeo..."
            sudo apt-get update -y
            sudo apt-get install -y skopeo
          fi

          # Extract every unique oci://<image>@sha256:<digest> ref (the
          # trailing !<selector> is a dynamic-plugins.yaml-ism, not part of
          # the OCI reference, and is dropped here).
          mapfile -t REFS < <(
            grep -oE 'oci://[^ !]+@sha256:[0-9a-f]{64}' "$FACE_FILE" | sort -u
          )

          if [ "${#REFS[@]}" -eq 0 ]; then
            echo "::error::No oci://...@sha256:... refs found in $FACE_FILE"
            exit 1
          fi

          echo "Found ${#REFS[@]} unique face pin(s) to anchor."

          FAILED=0
          for ref in "${REFS[@]}"; do
            image="${ref%@*}"
            image="${image#oci://}"
            digest="${ref##*@}"

            # --raw: works for both a plain manifest and a manifest list
            # (plain `skopeo inspect` fails to pick an instance on a list on
            # some skopeo versions, which would misreport a live pin as dead).
            echo "::group::Inspecting ${image}@${digest}"
            if ! skopeo inspect --raw "docker://${image}@${digest}" >/dev/null; then
              echo "::error::Face pin ${image}@${digest} does not exist in the registry (dead digest) — a boot against this face would crash-loop"
              FAILED=1
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"

            # Tag includes the digest: two different pins can share the same
            # repository (e.g. quay.io/veecode/marketplace is pinned twice,
            # at two different digests, for two different plugin selectors),
            # and a version-only tag would let the second anchor overwrite
            # the first, leaving it unprotected again.
            anchor_tag="face-${VERSION}-${digest#sha256:}"
            anchor_tag="${anchor_tag:0:127}"
            echo "::group::Anchoring ${image}@${digest} as ${image}:${anchor_tag}"
            # --all: copy every instance of a manifest list, not just the
            # arch the runner would default to — otherwise the anchor tag
            # would protect a different digest than the one being pinned.
            skopeo copy --all "docker://${image}@${digest}" "docker://${image}:${anchor_tag}"
            echo "::endgroup::"
            echo "Anchored ${image}@${digest} -> ${image}:${anchor_tag}"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more face pins are dead; failing the publish"
            exit 1
          fi
