#
# M2 gate #5 — ENTRYPOINT drift assertion (additive, VeeCode fork only).
#
# INVERTED AT M4.6 (3.0.0-beta.1). Until then the fork appended a fourth
# "--config app-config.veecode.yaml" pair to a retyped copy of upstream's
# array, and this workflow asserted "fork == upstream + that pair". That
# fragment moved to the config layer (chart values / local runner), the
# retyped ENTRYPOINT was deleted with it, and the fork now inherits upstream's
# ENTRYPOINT verbatim.
#
# So the assertion is now the inverse: the ENTRYPOINT in the fork's
# Containerfile (branch main, formerly veecode/main) must be EXACTLY the one in the live
# upstream/main Containerfile. That single check catches both directions —
# upstream changing its array, and anyone re-introducing an ENTRYPOINT
# override here without a decision. Re-adding drift is not forbidden; doing it
# silently is.
#
# main is also this repo's default branch, so scheduled runs, the
# push trigger, and workflow_dispatch all operate on the same branch — no
# cross-branch checkout is needed here.

name: Entrypoint Drift

on:
  workflow_dispatch:
  schedule:
    # Mondays 08:30 UTC — after the weekly Upstream Sync cron has merged.
    - cron: "30 8 * * 1"
  push:
    branches:
      - main
    paths:
      - build/containerfiles/Containerfile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assert-entrypoint-drift:
    name: Assert fork ENTRYPOINT matches live upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch live upstream main
        run: |
          git remote add upstream https://github.com/redhat-developer/rhdh.git
          git fetch --depth=1 upstream main

      - name: Assert the fork does not override upstream's ENTRYPOINT
        run: |
          set -euo pipefail

          # FETCH_HEAD is the ref `git fetch upstream main` just wrote — not
          # dependent on remote-tracking ref updates.
          UPSTREAM_ENTRYPOINT_SRC=$(git show FETCH_HEAD:build/containerfiles/Containerfile \
            | awk '/^ENTRYPOINT/{flag=1} flag{print} /\]/{if(flag)exit}')
          # Verified 2026-08-07: upstream's ENTRYPOINT is a single line; if
          # upstream later wraps it across lines, the awk above still covers it
          # (it accumulates until it hits ']').
          UPSTREAM_ARRAY=$(echo "$UPSTREAM_ENTRYPOINT_SRC" | sed -E 's/^ENTRYPOINT\s*//' | jq -c '.')

          # The LAST ^ENTRYPOINT line is what actually applies in a build. Since
          # M4.6 the fork appends none of its own, so this must be upstream's.
          FORK_ENTRYPOINT_SRC=$(grep '^ENTRYPOINT' build/containerfiles/Containerfile | tail -1)
          FORK_FULL=$(echo "$FORK_ENTRYPOINT_SRC" | sed -E 's/^ENTRYPOINT\s*//' | jq -c '.')

          # Do not sort either side: the order encodes config precedence and
          # the position of --require relative to packages/backend.
          [ "$UPSTREAM_ARRAY" = "$FORK_FULL" ] \
            || { echo "::error::DRIFT: the fork's effective ENTRYPOINT differs from live upstream/main. Either upstream changed its array, or an ENTRYPOINT override was re-introduced in this fork. Both need a recorded decision (AGENTS.md + devportal-planning) before this gate is relaxed."; echo "upstream: $UPSTREAM_ARRAY"; echo "fork:     $FORK_FULL"; exit 1; }

          echo "No drift: the fork inherits upstream's ENTRYPOINT verbatim (no VeeCode override since 3.0.0-beta.1)."
          echo "entrypoint: $UPSTREAM_ARRAY"
