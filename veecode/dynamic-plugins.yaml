# /opt/app-root/src/dynamic-plugins.yaml — baked default (the no-chart boot path)
#
# Fixed file name: the npm installer
# (@red-hat-developer-hub/cli-module-install-dynamic-plugins@0.5.0) reads this
# same fixed dynamic-plugins.yaml at CWD via the generated
# install-dynamic-plugins.sh wrapper. The 2.x image always shipped an
# equivalent baked file; the operator never had to create it from scratch
# (D3).
#
# `plugins:` stays empty by conscious decision. The factory plugins come from
# the plugin catalog index, which the `includes:` entry below names through
# the installer's placeholder. The installer replaces that placeholder when
# CATALOG_INDEX_IMAGE is set. This image ships no file at that path and sets no
# CATALOG_INDEX_IMAGE default, so a plain `docker run` without the variable
# boots with no factory plugins, like a stock upstream image. The chart and
# devportal-local set the index.
#
# To add your own plugins: mount your own dynamic-plugins.yaml over this path
# (read-only), the same pattern the 2.x compose used, or append to `plugins:`
# in a derived image.
#
# Do NOT use "preInstalled: true" — this image's plugin installer doesn't
# support that key.
includes:
  - dynamic-plugins.default.yaml
plugins: []
