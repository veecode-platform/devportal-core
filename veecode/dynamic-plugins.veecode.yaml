# ══ 0.1.1 — VeeCode 2.x default face, delivered via chart (M4.7) ═══════
# ── Docs / TechDocs (GAP-001; RHDH default frontend config — registers
#    the /docs route + the sidebar "Docs" item + the entity docs tab) ───
- package: oci://quay.io/veecode/backstage-plugin-techdocs@sha256:6cd5aa0c2727240e3f483c821b9cd5a9cb91f2884935806ae7f126714f04d87c!backstage-plugin-techdocs # was :bs_1.54.9__1.18.0
  disabled: false
  pluginConfig:
    dynamicPlugins:
      frontend:
        backstage.plugin-techdocs:
          appIcons:
            - name: docs
              importName: LibraryBooks
          dynamicRoutes:
            # /docs route only — NO inline menuItem. The Docs sidebar entry
            # is promoted into the CORE menu group as `default.docs` (see
            # default.main-menu-items below) so it can sit BETWEEN APIs and
            # Self-service. The app-shell renders default.* items and plugin
            # items as two divider-separated groups (Root.tsx
            # renderMenuItems filters on the `default.` name prefix), so a
            # plugin-named "docs" item can never cross into the core group
            # by priority alone.
            - path: /docs
              importName: TechDocsIndexPage
            - path: /docs/:namespace/:kind/:name/*
              importName: TechDocsReaderPage
          mountPoints:
            # `layout` is NOT optional here, and omitting it is a width bug,
            # not a cosmetic default. DynamicEntityTab renders every mount
            # point as `<Box sx={config.layout}>` inside a
            # `repeat(12, minmax(0,1fr))` grid container
            # (packages/app/src/components/catalog/EntityPage/
            # DynamicEntityTab.tsx), so a card with no layout takes ONE of
            # twelve columns — the TechDocs reader rendered at 115px inside a
            # 1624px tab. Upstream declares exactly this at
            # app-config.dynamic-plugins.yaml:547; measured 115px → 1624px.
            #
            # Upstream also carries `if: allOf: [isTechDocsAvailable]` here.
            # Deliberately NOT copied: it HIDES the Docs tab on entities with
            # no TechDocs annotation (measured — the tab disappears on the
            # m5-orders-demo fixture), which is a product decision about
            # entities without docs, not part of this width fix.
            - mountPoint: entity.page.docs/cards
              importName: EntityTechdocsContent
              config:
                layout:
                  gridColumn: "1 / -1"
- package: oci://quay.io/veecode/backstage-plugin-techdocs-backend@sha256:17238af383db90e1a597f1204f5df2dc2b3bb05e72af4ae5b7c5a88de85e12ff!backstage-plugin-techdocs-backend # was :bs_1.54.9__2.2.5
