# VeeCode product face — canonical version source (OD1 phase A).
#
# This file is the VeeCode product face: the 20-plugin set (Home, Header,
# RBAC UI, Theme, About, Marketplace/Extensions, TechDocs, Notifications,
# Signals, Tech Radar) that makes a stock devportal-core boot look and act
# like VeeCode DevPortal instead of a bare RHDH shell. It is baked into the
# devportal-core image at /opt/app-root/src/dynamic-plugins.veecode.yaml and
# wired in via the chart's `global.dynamic.includes` (level 0), ahead of the
# marketplace write-through include. It replaces the copy that used to live
# in `devportal-chart/charts/backstage/values.yaml` under `global.dynamic.plugins`
# — a Helm LIST that a customer setting the same key would silently REPLACE,
# erasing the whole face. Moving it here makes the face non-destructible by
# a customer values overlay.
#
# This file is read by the installer with `yaml.safe_load` (NOT Helm
# `tpl`-rendered) — every ref below is LITERAL. Do not add `{{ ... }}`
# template syntax here; it will not be expanded and will be passed through
# as a literal string.
#
# Refs are pinned by DIGEST where OCI (this file IS the canonical version
# source for VeeCode's own plugins — homepage/theme/marketplace — since no
# upstream CATALOG_INDEX_IMAGE covers them), or by exact npm version, or by
# `./dynamic-plugins/dist/...` local path (resolved from the installer's
# CWD, `/opt/app-root/src`, which is this image's own unpack directory).
#
# Customer override model (installer level 1 overrides level 0 per-package,
# `install-dynamic-plugins.py:643-658`):
#   - To disable ONE face plugin without restating the rest, add to your
#     values overlay under `global.dynamic.plugins`:
#       - package: <the exact ref below for that plugin>
#         disabled: true
#   - EDGE CASE: if your override ALSO sets `pluginConfig` for that package,
#     the override's `pluginConfig` REPLACES this file's `pluginConfig`
#     wholesale (installer does a dict.update, not a deep-merge) — you lose
#     every key you didn't restate, not just the ones you meant to change.
#     Prefer `disabled: true` alone; if you must reconfigure a face plugin,
#     copy this file's whole `pluginConfig` block for that package and edit
#     only what you need.
plugins:
# ── Home ────────────────────────────────────────────────────────────
# Q1 RESOLVED (2026-08-14): the VeeCode analytics home is the 3.x
# default. This entry must stay DISABLED, and re-enabling it is dead
# for TWO independent reasons, both verified in source:
# 1. visitsApiRef collision is FATAL — two plugin factories for the
#    same ref make AppManager THROW at boot (not "first wins";
#    ApiFactoryRegistry rejects equal-priority registration and
#    AppManager raises). The VeeCode home registers its own factory.
# 2. This plugin's VisitListener is gated on home.page/cards entries
#    (RecentlyVisitedCard/TopVisitedCard displayNames) the VeeCode
#    home never registers — it would be a no-op anyway. The recorder
#    is provided by the veecode-homepage plugin itself (below).
# Kept in full (disabled) as the one-line revert.
- package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-dynamic-home-page
  disabled: true
  pluginConfig:
    dynamicPlugins:
      frontend:
        red-hat-developer-hub.backstage-plugin-dynamic-home-page:
          translationResources:
            - importName: homepageTranslations
              ref: homepageTranslationRef
              module: Alpha
          dynamicRoutes:
            - path: /
              importName: DynamicHomePage
          mountPoints:
            - mountPoint: application/listener
              importName: VisitListener
            - mountPoint: home.page/cards
              importName: SearchBar
              config:
                layouts:
                  xl: { w: 10, h: 1, x: 1 }
                  lg: { w: 10, h: 1, x: 1 }
                  md: { w: 10, h: 1, x: 1 }
                  sm: { w: 10, h: 1, x: 1 }
                  xs: { w: 12, h: 1 }
                  xxs: { w: 12, h: 1 }
            - mountPoint: home.page/cards
              importName: QuickAccessCard
              config:
                layouts:
                  xl: { w: 7, h: 8 }
                  lg: { w: 7, h: 8 }
                  md: { w: 7, h: 8 }
                  sm: { w: 12, h: 8 }
                  xs: { w: 12, h: 8 }
                  xxs: { w: 12, h: 8 }
            - mountPoint: home.page/cards
              importName: CatalogStarredEntitiesCard
              config:
                layouts:
                  xl: { w: 5, h: 4, x: 7 }
                  lg: { w: 5, h: 4, x: 7 }
                  md: { w: 5, h: 4, x: 7 }
                  sm: { w: 12, h: 4 }
                  xs: { w: 12, h: 4 }
                  xxs: { w: 12, h: 4 }

# VeeCode analytics home (greeting + highlighted card + stat cards +
# summary + visited charts) — the 2.x default. Delivered from the
# export-overlays OCI pipeline (workspaces/veecode-homepage pinning
# devportal-plugins@08980aa1), the same channel as veecode-theme —
# devportal-plugins is source-only, its npm publish path is retired.
# The bundle carries the VisitListener export and the config.d.ts and
# useVisited(orderBy) fixes, built for this 1.52 shell (scoped publish
# branch homepage/bs-1.52.0, supported-versions 1.52.0). If the route
# 404s or mounts blank, check the browser console for
# scalprum/shared-scope errors FIRST.
# Pinned by DIGEST (the installer's documented integrity mechanism,
# docs/dynamic-plugins/installing-plugins.md:142) — bs_* tags are
# mutable in the overlays fleet (retag promotion). Digest below is
# tag bs_1.52.0 at publish time; bumping = new digest here.
- package: oci://quay.io/veecode/veecode-homepage@sha256:a524e997250b1865833376c03f6bbe7161ba6c5ca2e8ea3cf7d1992db6ba436c!veecode-platform-plugin-veecode-homepage # was :bs_1.52.0
  disabled: false
  pluginConfig:
    dynamicPlugins:
      frontend:
        veecode-platform.plugin-veecode-homepage:
          translationResources:
            - importName: homepageTranslations
              ref: homepageTranslationRef
          dynamicRoutes:
            - path: /
              importName: VeecodeHomepagePage
              config:
                props:
                  width: 1500
                  height: 800
          # Visit recorder — completes the recorder/storage/readers trio
          # this plugin owns. The v3 shell mounts no VisitListener of its
          # own (2.x mounted it statically in AppBase); it only consumes
          # the application/listener mount point, so without this entry
          # visitsApi.save() is never called and the "Recently/Top
          # visited" cards stay empty. Note the loader ignores
          # config.props/config.if on this mount point, and a missing
          # export fails SILENTLY (console warning only).
          mountPoints:
            - mountPoint: application/listener
              importName: VisitListener

# ── Header (rich default; owns default.admin sidebar group) ───────────
- package: ./dynamic-plugins/dist/red-hat-developer-hub-backstage-plugin-global-header
  disabled: false
  pluginConfig:
    dynamicPlugins:
      frontend:
        default.main-menu-items:
          menuItems:
            default.admin:
              title: Administration
              textKey: menuItem.administration
              icon: admin
            # Learning Paths is an upstream RHDH default menu item, never
            # shipped by VeeCode 2.x — remove it from the default sidebar
            # (M4.7 decision-round ruling 1). Slug verified against the
            # running 3.0.0-beta.1 image bundle: default.learning-path.
            default.learning-path:
              enabled: false
            # Sidebar order (M4.7). priority sorts DESC (higher = top).
            # These deep-merge with the built-in DefaultMainMenuItems
            # (packages/app/src/consts.ts), overriding ONLY priority and
            # keeping each item's title/icon/route. Target order:
            # Home > Catalog > APIs > Docs > Self-service > Notifications
            # > Tech Radar > Marketplace. The dynamic-plugin items carry
            # their priority in their own menuItems block (near each
            # plugin below) because the inline dynamicRoute menuItem form
            # DROPS priority (extractDynamicConfigFrontend.ts:96-104).
            default.home:
              priority: 100
            default.catalog:
              priority: 96
            default.apis:
              priority: 92
            # Docs promoted into the CORE group (name starts with
            # `default.`) so it sits between APIs and Self-service — the
            # order Gio asked for, which crosses the core/plugin divider a
            # plugin-named item cannot. Full definition (title/icon/to),
            # not just priority: there is no built-in default.docs to
            # deep-merge with. `to: docs` targets the /docs route
            # registered by the techdocs dynamicRoute above; `icon: docs`
            # resolves via the techdocs appIcon (getSystemIcon).
            default.docs:
              title: Docs
              icon: docs
              to: docs
              priority: 88
            default.create:
              priority: 84
        red-hat-developer-hub.backstage-plugin-global-header:
          translationResources:
            - importName: globalHeaderTranslations
              ref: globalHeaderTranslationRef
          mountPoints:
            - mountPoint: application/header
              importName: GlobalHeader
              config:
                # GAP-008/reverse-gap (M4.7): above-sidebar makes the header
                # span the FULL width (over the sidebar), which is what
                # created the full-width header + the stacked/duplicated logo.
                # All three 2.x configs use above-main-content — the header
                # sits to the RIGHT of the sidebar, logo lives in the sidebar
                # only. Match 2.x.
                position: above-main-content
            # GAP-008 (M4.7): the sidebar already renders app.branding.fullLogo
            # unconditionally, so mounting CompanyLogo here too produced the
            # duplicated/stacked wordmark. All three 2.x configs are
            # sidebar-only (no header logo) — so this mount is removed.
            - mountPoint: global.header/component
              importName: SearchComponent
              config:
                priority: 100
            - mountPoint: global.header/component
              importName: Spacer
              config:
                priority: 99
                props:
                  growFactor: 0
            - mountPoint: global.header/component
              importName: HeaderIconButton
              config:
                priority: 90
                props:
                  title: Self-service
                  titleKey: create.title
                  icon: add
                  to: create
            - mountPoint: global.header/component
              importName: StarredDropdown
              config:
                priority: 85
            - mountPoint: global.header/component
              importName: ApplicationLauncherDropdown
              config:
                priority: 82
            - mountPoint: global.header/component
              importName: HelpDropdown
              config:
                priority: 80
            - mountPoint: global.header/help
              importName: SupportButton
              config:
                priority: 10
            - mountPoint: global.header/component
              importName: NotificationButton
              config:
                priority: 70
            - mountPoint: global.header/component
              importName: Divider
              config:
                priority: 50
            - mountPoint: global.header/component
              importName: ProfileDropdown
              config:
                priority: 10
            - mountPoint: global.header/profile
              importName: MenuItemLink
              config:
                priority: 100
                props:
                  title: Settings
                  titleKey: profile.settings
                  link: /settings
                  icon: manageAccounts
            - mountPoint: global.header/profile
              importName: MenuItemLink
              config:
                priority: 90
                props:
                  title: My profile
                  titleKey: profile.myProfile
                  type: myProfile
                  icon: account
            - mountPoint: global.header/profile
              importName: LogoutButton
              config:
                priority: 10

